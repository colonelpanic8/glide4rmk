default_layer = 0

[[layer]]
id = "base"
name = "Base"
keys = """

KC_F1 KC_F2 KC_F3 KC_F4 KC_F5 -- KC_LSFT KC_RSFT -- KC_F6 KC_F7 KC_F8 KC_F9 KC_F10
KC_EQL KC_1 KC_2 KC_3 KC_4 KC_5 KC_LCTL KC_RCTL KC_6 KC_7 KC_8 KC_9 KC_0 KC_MINS
KC_TAB KC_Q KC_W KC_E KC_R KC_T MO(1) KC_LGUI KC_Y KC_U KC_I KC_O KC_P KC_BSLS
KC_ESC KC_A KC_S KC_D KC_F KC_G KC_BSPC KC_SPC KC_H KC_J KC_K KC_L KC_SCLN KC_QUOT
KC_GRV KC_Z KC_X KC_C KC_V KC_B KC_DEL KC_ENT KC_N KC_M KC_COMM KC_DOT KC_SLSH KC_PGUP
MO(2) KC_HOME KC_END KC_LEFT KC_RGHT -- KC_LALT KC_RALT -- KC_UP KC_DOWN KC_LBRC KC_RBRC KC_PGDN
"""

[[layer]]
id = "lower"
name = "Lower"
keys = """

KC_BRID KC_BRIU KC_MPRV KC_MNXT KC_MPLY -- KC_TRNS KC_TRNS -- KC_MUTE KC_VOLD KC_VOLU -- KC_PAUS
KC_TRNS -- -- -- -- KC_HOME KC_TRNS KC_TRNS LSFT(KC_9) KC_NUM KC_PEQL KC_PSLS KC_PAST KC_PSCR
KC_TRNS -- -- KC_UP -- KC_END TO(0) KC_TRNS LSFT(KC_0) KC_P7 KC_P8 KC_P9 KC_PMNS KC_SCRL
KC_TRNS -- KC_LEFT KC_DOWN KC_RGHT KC_PGUP KC_TRNS KC_TRNS LSFT(KC_5) KC_P4 KC_P5 KC_P6 KC_PPLS --
KC_TRNS KC_APP -- KC_F11 KC_F12 KC_PGDN KC_TRNS KC_TRNS KC_COMM KC_P1 KC_P2 KC_P3 KC_PENT KC_TRNS
MO(2) KC_CAPS KC_INS KC_F11 KC_F12 -- KC_TRNS KC_TRNS -- KC_P0 KC_P0 KC_PDOT KC_PENT KC_TRNS
"""

[[layer]]
id = "magic"
name = "Magic"
keys = """

USER(10) -- -- -- -- -- USER(2) -- -- -- -- -- -- USER(11)
-- -- -- -- -- -- USER(3) -- -- -- -- -- -- --
-- UG_SPDU UG_SATU UG_HUEU BL_UP BL_TOGG -- -- -- -- -- -- -- --
QK_BOOT UG_SPDD UG_SATD UG_HUED BL_DOWN UG_NEXT USER(0) -- -- -- -- -- -- USER(12)
QK_RBT MAINT_LOCK_TOG -- -- -- -- USER(1) -- -- -- -- -- -- QK_RBT
-- -- -- -- -- -- QK_OUTPUT_USB -- -- -- -- -- -- --
"""

