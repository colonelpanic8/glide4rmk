# A plain Glove80 layout for tests that need a realistic board and nothing
# else: three layers, no home-row mods, no combos, no tap dances, no Magic
# layer. TailorKey (glove80-tailorkey-qwerty.toml) stays the golden for
# round-trips and Flows.
default_layer = 0

[[layer]]
id = "layer0"
name = "Base"
keys = """

KC_F1 KC_F2 KC_F3 KC_F4 KC_F5 -- KC_LSFT KC_RSFT -- KC_F6 KC_F7 KC_F8 KC_F9 KC_F10
KC_EQL KC_1 KC_2 KC_3 KC_4 KC_5 KC_LCTL KC_RCTL KC_6 KC_7 KC_8 KC_9 KC_0 KC_MINS
KC_TAB KC_Q KC_W KC_E KC_R KC_T KC_LGUI KC_RALT KC_Y KC_U KC_I KC_O KC_P KC_BSLS
KC_ESC KC_A KC_S KC_D KC_F KC_G MO(1) MO(2) KC_H KC_J KC_K KC_L KC_SCLN KC_QUOT
KC_GRV KC_Z KC_X KC_C KC_V KC_B KC_BSPC KC_ENT KC_N KC_M KC_COMM KC_DOT KC_SLSH KC_PGUP
KC_LALT KC_HOME KC_END KC_LEFT KC_RGHT -- KC_DEL KC_SPC -- KC_UP KC_DOWN KC_LBRC KC_RBRC KC_PGDN
"""

