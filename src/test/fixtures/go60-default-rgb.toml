rows = 5
default_layer = 0

[[layer]]
id = "base"
name = "Base"
keys = """

KC_EQL KC_1 KC_2 KC_3 KC_4 KC_5 MO(2) MT(KC_ENT,RAlt) KC_6 KC_7 KC_8 KC_9 KC_0 KC_MINS
KC_TAB KC_Q KC_W KC_E KC_R KC_T KC_LSFT KC_SPC KC_Y KC_U KC_I KC_O KC_P KC_BSLS
KC_ESC KC_A KC_S KC_D KC_F KC_G KC_LCTL KC_LALT KC_H KC_J KC_K KC_L KC_SCLN KC_QUOT
MO(3) KC_Z KC_X KC_C KC_V KC_B -- -- KC_N KC_M KC_COMM KC_DOT KC_SLSH MO(1)
-- -- KC_GRV KC_DEL KC_BSPC -- -- -- -- KC_LGUI KC_LBRC KC_RBRC -- --
"""

[[layer]]
id = "keypad"
name = "Keypad"
keys = """

-- KC_F1 KC_F2 KC_F3 KC_F4 KC_F5 MO(2) KC_P0 KC_F6 KC_F7 KC_F8 KC_F9 KC_F10 KC_F11
KC_TRNS -- KC_HOME KC_UP KC_END KC_PGUP KC_TRNS KC_TRNS KC_P7 KC_P8 KC_P9 KC_PMNS KC_PSLS KC_F12
KC_TRNS LCTL(KC_Y) KC_LEFT KC_DOWN KC_RGHT KC_PGDN KC_TRNS KC_TRNS KC_P4 KC_P5 KC_P6 KC_PPLS KC_PAST KC_NUM
MO(3) LCTL(KC_Z) LCTL(KC_X) LCTL(KC_C) LCTL(KC_V) LCTL(LSFT(KC_V)) -- -- KC_P1 KC_P2 KC_P3 KC_PENT KC_EQL TO(0)
-- -- -- KC_TRNS KC_TRNS -- -- -- -- KC_P0 KC_PDOT KC_BSPC -- --
"""

[[layer]]
id = "symbolnav"
name = "SymbolNav"
keys = """

KC_INS KC_F1 KC_F2 KC_F3 KC_F4 KC_F5 TO(0) KC_TRNS KC_F6 KC_F7 KC_F8 KC_F9 KC_F10 KC_F11
KC_SCRL LSFT(KC_1) KC_HOME KC_UP KC_END KC_PGUP KC_TRNS KC_TRNS LSFT(KC_9) LSFT(KC_0) KC_UP LSFT(KC_5) KC_APP KC_F12
KC_CAPS LSFT(KC_2) KC_LEFT KC_DOWN KC_RGHT KC_PGDN KC_TRNS KC_TRNS LSFT(KC_4) KC_LEFT KC_DOWN KC_RGHT KC_PAUS KC_PSCR
MO(3) LSFT(KC_3) KC_LBRC KC_RBRC LSFT(KC_LBRC) LSFT(KC_RBRC) -- -- LSFT(KC_7) LSFT(KC_8) LSFT(KC_MINS) LSFT(KC_EQL) KC_LSFT KC_LCTL
-- -- LSFT(KC_6) KC_TRNS KC_TRNS -- -- -- -- KC_TRNS LCTL(LSFT(KC_TAB)) LCTL(KC_TAB) -- --
"""

[[layer]]
id = "magic"
name = "Magic"
keys = """

USER(10) KC_BRID KC_BRIU KC_MPRV KC_MNXT KC_MPLY -- -- KC_MUTE KC_VOLD KC_VOLU -- -- USER(11)
QK_BOOT UG_SPDU UG_SATU UG_HUEU BL_UP BL_TOGG -- -- -- -- -- -- -- USER(12)
QK_RBT UG_SPDD UG_SATD UG_HUED BL_DOWN UG_NEXT -- -- -- -- -- -- -- QK_RBT
-- MAINT_LOCK_TOG USER(0) USER(1) USER(2) -- -- -- -- -- -- -- -- --
-- -- QK_OUTPUT_USB -- -- -- -- -- -- -- -- -- -- --
"""

