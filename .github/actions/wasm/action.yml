name: WASM clients
description: >
  Puts the Rynk and MoErgo config WASM clients in src/vendor. They take about
  six minutes to build with Nix and change only with flake.nix, flake.lock and
  nix/, so they are cached by those files' hash and built only on a miss.
  A cache saved on master is read by every branch; one saved on a branch only
  by that branch.

runs:
  using: composite
  steps:
    - name: Restore WASM clients
      id: cache
      uses: actions/cache@v4
      with:
        path: wasm-out
        key: wasm-${{ runner.os }}-${{ hashFiles('flake.nix', 'flake.lock', 'nix/**') }}

    - name: Install Nix
      if: steps.cache.outputs.cache-hit != 'true'
      uses: DeterminateSystems/determinate-nix-action@v3

    - name: Build WASM clients
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        nix build .#rynk-wasm --out-link result-rynk-wasm
        nix build .#moergo-config-wasm --out-link result-moergo-config-wasm
        mkdir -p wasm-out
        cp -rL result-rynk-wasm wasm-out/rynk-wasm
        cp -rL result-moergo-config-wasm wasm-out/moergo-config-wasm

    - name: Put WASM clients in place
      shell: bash
      run: |
        mkdir -p src/vendor
        rm -rf src/vendor/rynk-wasm src/vendor/moergo-config-wasm
        cp -r wasm-out/rynk-wasm wasm-out/moergo-config-wasm src/vendor/
