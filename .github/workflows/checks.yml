name: Checks

# Every pull request is typechecked, linted, tested and built, on the merge
# result GitHub would make, so a change is known to pass before it is merged.
# Pull requests only: a push to a PR's branch used to start a second, identical
# run. Run it by hand (workflow_dispatch) for a branch without a PR.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: WASM clients
        uses: ./.github/actions/wasm

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc -b

      - name: Lint
        run: npm run lint

      # Not `npm test`: its pretest would build the WASM clients again.
      - name: Test
        run: npx vitest run

      - name: Build static site
        run: npx vite build
