
name: Import upstream pull requests

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  import-prs:
    runs-on: ubuntu-latest

    steps:
      - name: Import PRs 16, 17, 18 and 19
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPSTREAM: colonelpanic8/rynkbench
          TARGET: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
        run: |
          gh auth setup-git

          for PR in 16 17 18 19; do
            echo "Processing PR #$PR"

            DATA=$(gh api repos/$UPSTREAM/pulls/$PR)

            STATE=$(echo "$DATA" | jq -r '.state')

            if [ "$STATE" != "open" ]; then
              echo "PR #$PR is not open. Skipping."
              continue
            fi

            TITLE=$(echo "$DATA" | jq -r '.title')
            BODY=$(echo "$DATA" | jq -r '.body // ""')
            HEAD_REPO=$(echo "$DATA" | jq -r '.head.repo.full_name // ""')
            HEAD_REF=$(echo "$DATA" | jq -r '.head.ref')

            if [ -z "$HEAD_REPO" ]; then
              echo "Source repository unavailable for PR #$PR"
              continue
            fi

            BRANCH="upstream-pr-$PR"

            WORKDIR="$RUNNER_TEMP/pr-$PR"
            mkdir -p "$WORKDIR"
            cd "$WORKDIR"

            git init
            git remote add source "https://github.com/$HEAD_REPO.git"
            git fetch --no-tags source "$HEAD_REF"

            git remote add origin "https://github.com/$TARGET.git"

            git push origin FETCH_HEAD:"refs/heads/$BRANCH" --force

            EXISTING=$(gh pr list \
              --repo "$TARGET" \
              --head "$OWNER:$BRANCH" \
              --base master \
              --state open \
              --json number \
              --jq 'length')

            if [ "$EXISTING" -gt 0 ]; then
              echo "PR #$PR already imported."
              continue
            fi

            gh api \
              --method POST \
              "repos/$TARGET/pulls" \
              -f title="$TITLE" \
              -f body="$BODY" \
              -f head="$OWNER:$BRANCH" \
              -f base="master"

            echo "Imported PR #$PR successfully."
          done
