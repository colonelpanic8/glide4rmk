name: Build and deploy GLIDE4RMK

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

# Merging several pull requests close together starts a deploy for each; the
# newer one cancels the older, so the last merge is what goes live. A cancelled
# deploy here is expected, not a failure.
concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  # The WASM clients, built only when the flake changed, and pushed to
  # ci/vendor-wasm-out with their WASM_KEY whenever that branch is stale, so a
  # session without Nix gets current ones (scripts/setup-session.sh). Its own job:
  # the only one that may write to the repository, and it runs no npm code.
  wasm:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: WASM clients
        uses: ./.github/actions/wasm
        with:
          publish-branch: ci/vendor-wasm-out
          token: ${{ github.token }}

  deploy:
    needs: wasm
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: WASM clients
        uses: ./.github/actions/wasm

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Checks tested each pull request on its own; two merged close together
      # were never tested together. What goes live is tested here first.
      # The WASM clients are in place (from the cache the wasm job saved); `npm test`
      # and `npm run build` would only check their WASM_KEY again.
      - name: Typecheck
        run: npx tsc -b

      - name: Test
        run: npx vitest run

      - name: Build GLIDE4RMK
        run: npx vite build

      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail

          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Cloudflare credentials are missing"
            exit 1
          fi

          npx --yes wrangler@4 deploy \
            --assets dist \
            --name glide4rmk \
            --compatibility-date 2026-10-01
