name: Build and deploy GLIDE4RMK

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # The WASM clients take about six minutes to build with Nix and change
      # only with flake.nix, flake.lock and nix/: keep the built files and
      # build them again only when one of those changes.
      - name: Restore WASM clients
        id: wasm
        uses: actions/cache@v4
        with:
          path: wasm-out
          key: wasm-${{ runner.os }}-${{ hashFiles('flake.nix', 'flake.lock', 'nix/**') }}

      - name: Install Nix
        if: steps.wasm.outputs.cache-hit != 'true'
        uses: DeterminateSystems/determinate-nix-action@v3

      - name: Build WASM clients
        if: steps.wasm.outputs.cache-hit != 'true'
        run: |
          nix build .#rynk-wasm --out-link result-rynk-wasm
          nix build .#moergo-config-wasm --out-link result-moergo-config-wasm
          mkdir -p wasm-out
          cp -rL result-rynk-wasm wasm-out/rynk-wasm
          cp -rL result-moergo-config-wasm wasm-out/moergo-config-wasm

      - name: Put WASM clients in place
        run: |
          mkdir -p src/vendor
          rm -rf src/vendor/rynk-wasm src/vendor/moergo-config-wasm
          cp -r wasm-out/rynk-wasm wasm-out/moergo-config-wasm src/vendor/

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Not `npm run build`: its prebuild would build the WASM clients again.
      - name: Build GLIDE4RMK
        run: npx tsc -b && npx vite build

      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail

          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Cloudflare credentials are missing"
            exit 1
          fi

          npx --yes wrangler@4 deploy \
            --assets dist \
            --name glide4rmk \
            --compatibility-date 2026-10-01
